name: Build taoyao Silicium UEFI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-taoyao-uefi.yml'
      - 'devices/taoyao/uefi/**'
      - 'devices/taoyao/prebuilt/device-tree.dtb'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TAOYAO_ROM_URL: https://bigota.d.miui.com/OS1.0.34.0.ULIMIXM/taoyao_global_images_OS1.0.34.0.ULIMIXM_20260525.0000.00_14.0_global_e8602e568a.tgz
      TAOYAO_ROM_MD5: e8602e568a7b82cabc34b7f3aeb43b72
      MU_DIR: ${{ github.workspace }}/Mu-Silicium
      OUT_DIR: ${{ github.workspace }}/out/taoyao-uefi

    steps:
      - uses: actions/checkout@v4

      - name: Validate target inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAOYAO_ROM_URL" == https://bigota.d.miui.com/* ]] || { echo "::error::Unexpected firmware host."; exit 1; }
          [[ "$TAOYAO_ROM_MD5" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "::error::Invalid ROM MD5."; exit 1; }
          test -s devices/taoyao/prebuilt/device-tree.dtb
          echo "Using official Xiaomi 12 Lite Global firmware for model family 2203129G / taoyao."

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm nasm gcc-aarch64-linux-gnu git python3 python3-pip python3-venv mono-complete curl p7zip-full

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download verified official Xiaomi fastboot ROM and extract XBL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/taoyao/rom" "$RUNNER_TEMP/taoyao/extract"
          rom="$RUNNER_TEMP/taoyao/taoyao-global-fastboot.tgz"
          curl --fail --location --silent --show-error --retry 3 --output "$rom" "$TAOYAO_ROM_URL"
          printf '%s  %s\n' "$TAOYAO_ROM_MD5" "$rom" | md5sum --check --status || {
            echo "::error::Official Xiaomi fastboot ROM MD5 mismatch."
            exit 1
          }
          tar -xzf "$rom" -C "$RUNNER_TEMP/taoyao/extract" --wildcards '*/images/xbl.img'
          mapfile -t xbls < <(find "$RUNNER_TEMP/taoyao/extract" -type f -name xbl.img)
          [[ "${#xbls[@]}" -eq 1 && -s "${xbls[0]}" ]] || {
            echo "::error::Could not uniquely extract images/xbl.img from verified ROM."
            exit 1
          }
          install -m 0644 "${xbls[0]}" "$RUNNER_TEMP/taoyao/xbl.img"
          sha256sum "$RUNNER_TEMP/taoyao/xbl.img" | tee "$RUNNER_TEMP/taoyao/xbl.sha256"
          rm -f "$rom"

      - name: Apply pinned Mu-Silicium port
        run: |
          set -euo pipefail
          devices/taoyao/uefi/apply.sh
          test -f "$MU_DIR/Platforms/Xiaomi/taoyaoPkg/taoyao.dsc"
          test -f "$MU_DIR/Resources/DTBs/taoyao.dtb"

      - name: Configure safe UEFI-only first boot
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$MU_DIR" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          shim = root / "BootShim/BootShim.S"
          text = shim.read_text()
          start = text.find("#ifdef PAYLOAD_BASE")
          if start < 0:
              raise SystemExit("Expected experimental PAYLOAD_BASE block was not found")
          end = text.find("#endif", start)
          if end < 0:
              raise SystemExit("PAYLOAD_BASE block has no #endif")
          shim.write_text(text[:start] + text[end + len("#endif"):])
          bm = root / "Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/BootManager.c"
          text = bm.read_text().replace('#include "XnuLoader.h"\n', "")
          call = '  // Nothing else to boot: hand over to the XNU loader (does not return)\n  XnuLoaderMain ();\n\n'
          if call not in text:
              raise SystemExit("Expected XnuLoader handoff was not found in BootManager.c")
          bm.write_text(text.replace(call, "", 1))
          inf = root / "Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/BootManagerLib.inf"
          text = inf.read_text()
          if "  XnuLoader.c\n" not in text:
              raise SystemExit("Expected XnuLoader.c source entry was not found")
          inf.write_text(text.replace("  XnuLoader.c\n", "", 1))
          PY
          grep -q 'append_dtb         = false' devices/taoyao/uefi/files/Resources/Configs/taoyao.toml

      - name: Extract proprietary drivers from device XBL
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/MSMTools/UEFIReader.git "$RUNNER_TEMP/UEFIReader"
          dotnet run --project "$RUNNER_TEMP/UEFIReader/UEFIReader/UEFIReader.csproj" -- "$RUNNER_TEMP/taoyao/xbl.img" "$MU_DIR/Binaries/taoyao"
          mapfile -t qcom_dirs < <(find "$MU_DIR/Binaries/taoyao" -mindepth 2 -maxdepth 3 -type d -name QcomPkg)
          [[ "${#qcom_dirs[@]}" -eq 1 ]] || { echo "::error::Could not uniquely locate UEFIReader QcomPkg output."; exit 1; }
          build_root="$(dirname "${qcom_dirs[0]}")"
          cp -a "$build_root/." "$MU_DIR/Binaries/taoyao/"
          rm -rf "$build_root"
          for f in QcomPkg/Drivers/EnvDxe/EnvDxe.inf QcomPkg/Drivers/UFSDxe/UFSDxe.inf QcomPkg/Drivers/UsbConfigDxe/UsbConfigDxe.inf QcomPkg/Drivers/UsbMsdDxe/UsbMsdDxe.inf QcomPkg/Drivers/ButtonsDxe/ButtonsDxe.inf RawFiles/uefiplat.cfg RawFiles/SecParti.cfg RawFiles/uefipil.cfg; do
            test -s "$MU_DIR/Binaries/taoyao/$f" || { echo "::error::Missing XBL extraction: $f"; exit 1; }
          done
          while IFS= read -r f; do
            test -s "$MU_DIR/Binaries/taoyao/$f" || { echo "::error::Missing referenced vendor file: $f"; exit 1; }
          done < <(grep -hE '^[[:space:]]*INF Binaries/taoyao/' devices/taoyao/uefi/files/Platforms/Xiaomi/taoyaoPkg/Include/*.inc | sed -E 's#^[[:space:]]*INF Binaries/taoyao/##' | sort -u)

      - name: Prepare Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/uefi-venv"
          "$RUNNER_TEMP/uefi-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/uefi-venv/bin/pip" install -r "$MU_DIR/pip-requirements.txt"

      - name: Build UEFI and package Android boot-v1 image
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/uefi-venv/bin/activate"
          cd "$MU_DIR"

          python3 build_uefi.py -d taoyao -r RELEASE
          test -s Mu-taoyao.img
          fd="Build/taoyaoPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd"
          test -s "$fd"
          [[ "$(stat -c %s "$fd")" -eq 2097152 ]] || { echo "::error::UEFI FD must be exactly 2 MiB."; exit 1; }
          install -D "$fd" "$OUT_DIR/SILICIUM_UEFI.fd"
          install -D BootShim/BootShim.bin "$OUT_DIR/BootShim.bin"
          install -D Resources/DTBs/taoyao.dtb "$OUT_DIR/taoyao.dtb"
          install -D Mu-taoyao.img "$OUT_DIR/uefi.img"

      - name: Audit image structure and checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$OUT_DIR/uefi.img" "$OUT_DIR/BootShim.bin" "$OUT_DIR/SILICIUM_UEFI.fd" <<'PY'
          import gzip, pathlib, struct, sys
          image, shim_path, fd_path = map(pathlib.Path, sys.argv[1:])
          b = image.read_bytes()
          shim = shim_path.read_bytes()
          fd = fd_path.read_bytes()
          if len(b) < 4096 or b[:8] != b"ANDROID!":
              raise SystemExit("FAIL: output is not an Android boot image")
          header_version = struct.unpack_from("<I", b, 40)[0]
          kernel_size = struct.unpack_from("<I", b, 8)[0]
          ramdisk_size = struct.unpack_from("<I", b, 16)[0]
          if header_version != 1:
              raise SystemExit(f"FAIL: expected Android boot header v1, got {header_version}")
          if not kernel_size or not ramdisk_size:
              raise SystemExit("FAIL: kernel or ramdisk payload is empty")
          kernel = b[4096:4096 + kernel_size]
          if len(kernel) != kernel_size or not kernel.startswith(bytes([0x1f, 0x8b])):
              raise SystemExit("FAIL: Android kernel payload is not a complete gzip stream")
          unpacked = gzip.decompress(kernel)
          if unpacked[:len(shim)] != shim:
              raise SystemExit("FAIL: decompressed kernel does not begin with the exact BootShim binary")
          if unpacked[len(shim):len(shim) + len(fd)] != fd:
              raise SystemExit("FAIL: UEFI FD is not immediately after BootShim")
          if len(fd) != 0x200000:
              raise SystemExit(f"FAIL: expected 2 MiB UEFI FD, got {len(fd)}")
          if unpacked[56:60] != b"ARM" + bytes([0x64]):
              raise SystemExit("FAIL: BootShim ARM64 Image header magic is missing")
          ramdisk_offset = 4096 + ((kernel_size + 4095) // 4096) * 4096
          if ramdisk_offset + ramdisk_size > len(b):
              raise SystemExit("FAIL: image is truncated before the complete ramdisk")
          print(f"PASS: Android boot-v1; gzip kernel contains BootShim ({len(shim)} bytes) + 2 MiB UEFI FD; ramdisk={ramdisk_size}")
          PY
          {
            echo "Target: Xiaomi 12 Lite taoyao / SM7325 / AArch64"
            echo "Artifact: uefi.img"
            echo "Format: Android boot image header v1; gzip(BootShim + 2 MiB UEFI FD); Mu-Silicium ramdisk; no appended DTB"
            echo "UEFI FD base: 0x9FD00000"
            echo "UEFI FD size: 0x00200000"
            echo "BootShim payload base: not used (UEFI-only build)"
            echo "Official Xiaomi Global ROM MD5 verified; extracted XBL SHA-256 recorded; proprietary XBL source not packaged"
            echo "XNU handoff: DISABLED (no XNUP payload supplied)\nHardware UEFI boot tested: NO"
            echo "Native XNU bootable: NO"
            echo "Fastboot RAM boot: NOT YET VERIFIED on physical taoyao; do not flash to a partition."
          } > "$OUT_DIR/BUILD-INFO.txt"
          (cd "$OUT_DIR" && sha256sum uefi.img SILICIUM_UEFI.fd BootShim.bin taoyao.dtb BUILD-INFO.txt > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: taoyao-uefi-image-${{ github.sha }}
          path: out/taoyao-uefi/
          if-no-files-found: error
          retention-days: 3
