name: Build taoyao Silicium UEFI

on:
  workflow_dispatch:
  push:
    branches:
      - work/taoyao-xnu-platform-preflight
    paths:
      - ".github/workflows/build-taoyao-uefi.yml"
      - "devices/taoyao/**"
      - "xnuloader/**"
      - "mkxnuimg.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      # Official Xiaomi 12 Lite (taoyao) Global fastboot ROM.
      # Singapore Xiaomi OSS mirror is primary; bigota and hugeota are fallbacks.
      XIAOMI_ROM_NAME: taoyao_global_images_OS1.0.34.0.ULIMIXM_20260525.0000.00_14.0_global_e8602e568a.tgz
      XIAOMI_ROM_MD5: e8602e568a7b82cabc34b7f3aeb43b72
      XIAOMI_ROM_PATH: /OS1.0.34.0.ULIMIXM/taoyao_global_images_OS1.0.34.0.ULIMIXM_20260525.0000.00_14.0_global_e8602e568a.tgz
      MU_DIR: ${{ github.workspace }}/Mu-Silicium
      OUT_DIR: ${{ github.workspace }}/out/taoyao-uefi

    steps:
      - uses: actions/checkout@v4

      - name: Validate taoyao build inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$XIAOMI_ROM_MD5" =~ ^[0-9a-f]{32}$ ]] || {
            echo "::error::Pinned Xiaomi ROM MD5 is malformed."
            exit 1
          }
          test -s devices/taoyao/prebuilt/device-tree.dtb

      - name: Audit taoyao DDR window for XNU
        run: |
          set -euo pipefail
          python3 devices/taoyao/uefi/audit-memory-map.py \
            --dtb devices/taoyao/prebuilt/device-tree.dtb \
            --memory-map devices/taoyao/uefi/files/Platforms/Xiaomi/taoyaoPkg/Library/MemoryMapLib/MemoryMapLib.c \
            --loader xnuloader/loader.c

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm nasm gcc-aarch64-linux-gnu git python3 python3-pip python3-venv mono-complete curl p7zip-full

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download official Xiaomi firmware (fast mirror + fallback)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/taoyao"
          cd "$RUNNER_TEMP/taoyao"
          urls=(
            # Xiaomi's published Southeast Asia mirror (Singapore OSS endpoint).
            "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com${XIAOMI_ROM_PATH}"
            "https://bigota.d.miui.com${XIAOMI_ROM_PATH}"
            "https://hugeota.d.miui.com${XIAOMI_ROM_PATH}"
          )
          downloaded=0
          for url in "${urls[@]}"; do
            url_host="${url#https://}"
            url_host="${url_host%%/*}"
            echo "::group::Trying official Xiaomi CDN: $url_host"
            rm -f "$XIAOMI_ROM_NAME"
            if curl --fail --location --show-error --retry 1 --retry-all-errors \
                --connect-timeout 25 --speed-time 90 --speed-limit 65536 \
                --output "$XIAOMI_ROM_NAME" "$url"; then
              if printf '%s  %s\n' "$XIAOMI_ROM_MD5" "$XIAOMI_ROM_NAME" | md5sum --check --status; then
                downloaded=1
                echo "Official Xiaomi ROM downloaded and MD5-verified."
                echo "::endgroup::"
                break
              fi
              echo "::warning::Downloaded file failed Xiaomi ROM MD5; trying next official CDN."
            else
              echo "::warning::This official CDN failed or was too slow; trying the next official CDN."
            fi
            echo "::endgroup::"
          done
          [[ "$downloaded" -eq 1 ]] || {
            echo "::error::Could not download and verify the pinned official Xiaomi ROM from any configured official mirror."
            exit 1
          }
          echo "ROM_SHA256=$(sha256sum "$XIAOMI_ROM_NAME" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Extract XBL from verified official firmware
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/taoyao/$XIAOMI_ROM_NAME"
          extract_dir="$RUNNER_TEMP/taoyao/extract"
          mkdir -p "$extract_dir"
          # Xiaomi packages may call this partition image xbl.elf or xbl.img.
          # List first, then extract exactly the single matching images entry.
          mapfile -t xbl_entries < <(tar -tzf "$archive" | grep -E '(^|/)images/xbl[.](elf|img)$' || true)
          if [[ "${#xbl_entries[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one images/xbl.elf or images/xbl.img entry; found ${#xbl_entries[@]}."
            echo "XBL-like archive entries:"
            tar -tzf "$archive" | grep -Ei '(^|/)images/xbl[^/]*$' || true
            exit 1
          fi
          xbl_entry="${xbl_entries[0]}"
          echo "Selected firmware entry: $xbl_entry"
          tar -xzf "$archive" -C "$extract_dir" -- "$xbl_entry"
          extracted_xbl="$extract_dir/$xbl_entry"
          test -s "$extracted_xbl"
          install -m 0644 "$extracted_xbl" "$RUNNER_TEMP/taoyao/xbl.img"
          test -s "$RUNNER_TEMP/taoyao/xbl.img"
          python3 - "$RUNNER_TEMP/taoyao/xbl.img" <<'PY'
          import pathlib, struct, sys
          p = pathlib.Path(sys.argv[1])
          b = p.read_bytes()
          if len(b) < 64 or b[:4] != b"\x7fELF":
              raise SystemExit("FAIL: extracted xbl.img is not ELF")
          if b[4] != 2 or b[5] != 1 or struct.unpack_from("<H", b, 18)[0] != 183:
              raise SystemExit("FAIL: XBL is not ELF64 little-endian AArch64")
          if b"taoyao" not in b:
              raise SystemExit("FAIL: XBL does not contain the taoyao platform identifier")
          print(f"PASS: taoyao AArch64 XBL structure ({len(b)} bytes)")
          PY
          xbl_sha256="$(sha256sum "$RUNNER_TEMP/taoyao/xbl.img" | cut -d' ' -f1)"
          echo "XBL_SHA256=$xbl_sha256" >> "$GITHUB_ENV"
          rm -rf "$extract_dir" "$archive"
          echo "Extracted $xbl_entry from the verified official Xiaomi ROM and normalized it to xbl.img."
          echo "ROM SHA-256: $ROM_SHA256"
          echo "XBL SHA-256: $xbl_sha256"

      - name: Apply pinned Mu-Silicium port
        run: |
          set -euo pipefail
          devices/taoyao/uefi/apply.sh
          test -f "$MU_DIR/Platforms/Xiaomi/taoyaoPkg/taoyao.dsc"
          test -f "$MU_DIR/Resources/DTBs/taoyao.dtb"

      - name: Extract proprietary drivers from device XBL
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/MSMTools/UEFIReader.git "$RUNNER_TEMP/UEFIReader"
          dotnet run --project "$RUNNER_TEMP/UEFIReader/UEFIReader/UEFIReader.csproj" -- "$RUNNER_TEMP/taoyao/xbl.img" "$MU_DIR/Binaries/taoyao"
          mapfile -t qcom_dirs < <(find "$MU_DIR/Binaries/taoyao" -mindepth 2 -maxdepth 3 -type d -name QcomPkg)
          [[ "${#qcom_dirs[@]}" -eq 1 ]] || { echo "::error::Could not uniquely locate UEFIReader QcomPkg output."; exit 1; }
          build_root="$(dirname "${qcom_dirs[0]}")"
          cp -a "$build_root/." "$MU_DIR/Binaries/taoyao/"
          rm -rf "$build_root"
          for f in QcomPkg/Drivers/EnvDxe/EnvDxe.inf QcomPkg/Drivers/UFSDxe/UFSDxe.inf QcomPkg/Drivers/UsbConfigDxe/UsbConfigDxe.inf QcomPkg/Drivers/UsbMsdDxe/UsbMsdDxe.inf QcomPkg/Drivers/ButtonsDxe/ButtonsDxe.inf RawFiles/uefiplat.cfg RawFiles/SecParti.cfg RawFiles/uefipil.cfg; do
            test -s "$MU_DIR/Binaries/taoyao/$f" || { echo "::error::Missing XBL extraction: $f"; exit 1; }
          done
          while IFS= read -r f; do
            test -s "$MU_DIR/Binaries/taoyao/$f" || { echo "::error::Missing referenced vendor file: $f"; exit 1; }
          done < <(grep -hE '^[[:space:]]*INF Binaries/taoyao/' devices/taoyao/uefi/files/Platforms/Xiaomi/taoyaoPkg/Include/*.inc | sed -E 's#^[[:space:]]*INF Binaries/taoyao/##' | sort -u)

      - name: Prepare Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/uefi-venv"
          "$RUNNER_TEMP/uefi-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/uefi-venv/bin/pip" install -r "$MU_DIR/pip-requirements.txt"

      - name: Build UEFI and package Android boot-v1 image
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/uefi-venv/bin/activate"
          cd "$MU_DIR"

          python3 build_uefi.py -d taoyao -r RELEASE
          test -s Mu-taoyao.img
          fd="Build/taoyaoPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd"
          test -s "$fd"
          [[ "$(stat -c %s "$fd")" -eq 2097152 ]] || { echo "::error::UEFI FD must be exactly 2 MiB."; exit 1; }
          install -D "$fd" "$OUT_DIR/SILICIUM_UEFI.fd"
          install -D Resources/DTBs/taoyao.dtb "$OUT_DIR/taoyao.dtb"

          # Build a placeholder-identity USB loader. This validates the UEFI
          # handoff path only; it is not a native iOS/XNU boot configuration.
          cd "$GITHUB_WORKSPACE"
          ./xnuloader/mkidentity.sh --placeholder
          ./xnuloader/build.sh
          python3 xnuloader/mkpayload.py \
            -o "$RUNNER_TEMP/taoyao/taoyao-loader.xnup" \
            "loader.efi=$GITHUB_WORKSPACE/xnuloader/loader.efi" --usb
          python3 mkxnuimg.py --device taoyao \
            --payload "$RUNNER_TEMP/taoyao/taoyao-loader.xnup" \
            --output "$OUT_DIR/uefi.img"
          install -D "$MU_DIR/BootShim/BootShim.bin" "$OUT_DIR/BootShim.bin"
          install -D xnuloader/loader.efi "$OUT_DIR/taoyao-loader.efi"
          install -D "$RUNNER_TEMP/taoyao/taoyao-loader.xnup" "$OUT_DIR/taoyao-loader.xnup"

      - name: Audit image structure and checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$OUT_DIR/uefi.img" "$OUT_DIR/BootShim.bin" "$OUT_DIR/SILICIUM_UEFI.fd" "$OUT_DIR/taoyao-loader.xnup" "$OUT_DIR/taoyao.dtb" <<'PY'
          import pathlib, struct, sys, zlib
          image, shim_path, fd_path, payload_path, dtb_path = map(pathlib.Path, sys.argv[1:])
          b = image.read_bytes()
          if len(b) < 2048 or b[:8] != b"ANDROID!":
              raise SystemExit("FAIL: output is not an Android boot image")
          header_version = struct.unpack_from("<I", b, 40)[0]
          page_size = struct.unpack_from("<I", b, 36)[0]
          kernel_size = struct.unpack_from("<I", b, 8)[0]
          ramdisk_size = struct.unpack_from("<I", b, 16)[0]
          if header_version != 1:
              raise SystemExit(f"FAIL: expected Android boot header v1, got {header_version}")
          if page_size not in (2048, 4096, 8192, 16384):
              raise SystemExit(f"FAIL: unsupported Android boot page size {page_size}")
          if not kernel_size or not ramdisk_size:
              raise SystemExit("FAIL: kernel or ramdisk payload is empty")
          ramdisk_offset = page_size + ((kernel_size + page_size - 1) // page_size) * page_size
          if ramdisk_offset + ramdisk_size > len(b):
              raise SystemExit("FAIL: image is truncated before the complete ramdisk")
          kernel = b[page_size:page_size + kernel_size]
          dec = zlib.decompressobj(16 + zlib.MAX_WBITS)
          raw = dec.decompress(kernel)
          if not dec.eof or dec.unconsumed_tail:
              raise SystemExit("FAIL: kernel gzip stream is incomplete")
          shim, fd, payload, dtb = (p.read_bytes() for p in (shim_path, fd_path, payload_path, dtb_path))
          if len(fd) != 0x200000:
              raise SystemExit(f"FAIL: UEFI FD size is {len(fd)}, expected 2 MiB")
          if payload[:4] != b"XNUP" or len(payload) < 32:
              raise SystemExit("FAIL: loader payload is not a complete XNUP container")
          declared = struct.unpack_from("<I", payload, 4)[0]
          if declared + 8 != len(payload):
              raise SystemExit("FAIL: XNUP size field does not match payload length")
          if raw != shim + fd + payload:
              raise SystemExit("FAIL: decompressed boot kernel is not exactly BootShim + UEFI FD + XNUP")
          if dec.unused_data != dtb:
              raise SystemExit("FAIL: DTB appended after gzip member does not match the selected device tree")
          if payload[8:24].split(b"\0", 1)[0] != b"loader.efi":
              raise SystemExit("FAIL: first XNUP entry is not loader.efi")
          print(f"PASS: Android boot-v1 page={page_size}; kernel={kernel_size}; ramdisk={ramdisk_size}; shim={len(shim)}; FD={len(fd)}; XNUP={len(payload)}; DTB={len(dtb)}")
          PY
          {
            echo "Target: Xiaomi 12 Lite taoyao / SM7325 / AArch64"
            echo "Artifact: uefi.img"
            echo "Format: Android boot-v1; gzip(BootShim + 2 MiB UEFI FD + XNUP loader payload) + taoyao DTB; Mu-Silicium ramdisk"
            echo "UEFI FD base: 0x9FD00000"
            echo "UEFI FD size: 0x00200000"
            echo "BootShim XNUP payload base: 0xF0000000"
            echo "XNU loader: placeholder identity; USB mode; no kernel or Apple IPSW identity"
            echo "XNU RAM window: 0x100000000..0x280000000 (6 GiB; statically checked against taoyao DTB)"
            echo "Firmware source: official Xiaomi taoyao Global OS1.0.34.0.ULIMIXM fastboot ROM"
            echo "Firmware CDN: Singapore Xiaomi OSS mirror, then bigota, then hugeota"
            echo "Firmware ROM MD5 verified before XBL extraction"
            echo "Hardware UEFI boot tested: NO"
            echo "Native XNU bootable: NO"
            echo "Do not flash or fastboot boot this experimental image."
          } > "$OUT_DIR/BUILD-INFO.txt"
          (cd "$OUT_DIR" && sha256sum uefi.img SILICIUM_UEFI.fd BootShim.bin taoyao.dtb taoyao-loader.efi taoyao-loader.xnup BUILD-INFO.txt > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: taoyao-uefi-image-${{ github.sha }}
          path: out/taoyao-uefi/
          if-no-files-found: error
          retention-days: 3
