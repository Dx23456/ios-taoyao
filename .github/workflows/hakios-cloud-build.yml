name: HakiOS Cloud Build & Audit Pipeline

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Target to execute'
        required: true
        default: 'audit-only'
        type: choice
        options:
          - audit-only
          - qemu-open
          - xnu-kernel
      jobs:
        description: 'Parallel build jobs'
        required: false
        default: '4'

jobs:
  hakios-build:
    name: HakiOS Builder (${{ github.event.inputs.build_target }})
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            lld \
            llvm \
            bison \
            flex \
            libncurses-dev \
            libssl-dev \
            uuid-dev \
            libglib2.0-dev \
            libpixman-1-dev \
            pkg-config \
            python3 \
            perl \
            git \
            curl \
            cmake \
            ninja-build \
            qemu-system-arm

      - name: Verify UUID Header Availability
        run: |
          if [ ! -f "/usr/include/uuid/uuid.h" ]; then
            echo "ERROR: /usr/include/uuid/uuid.h not found!"
            exit 1
          fi
          echo "SUCCESS: uuid/uuid.h verified."

      - name: Setup Theos & SDK Environment
        run: |
          export THEOS=/opt/theos
          sudo mkdir -p $THEOS
          sudo chown -R $USER:$USER $THEOS
          git clone --recursive https://github.com/theos/theos.git $THEOS
          
          # Download and set up iPhoneOS 16.5 SDK
          mkdir -p $THEOS/sdks
          curl -LO https://github.com/theos/sdks/releases/download/v1.0/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks/
          rm iPhoneOS16.5.sdk.tar.xz

      - name: Initialize XNU Dependencies & Fix availability.pl
        run: |
          chmod +x xnu-build.sh || true
          if [ -f "xnu-deps/setup.sh" ]; then
            chmod +x xnu-deps/setup.sh
            ./xnu-deps/setup.sh || true
          fi

          # Force SDK overlay directory existence
          SDK_DIR="$GITHUB_WORKSPACE/xnu-deps/sdk/iPhoneOS16.5.xnu.sdk/usr/local/libexec"
          mkdir -p "$SDK_DIR"

          # Provide fallback availability.pl if missing
          if [ ! -f "$SDK_DIR/availability.pl" ]; then
            echo "Creating availability.pl shim..."
            printf '#!/usr/bin/env perl\nprint "10.0\\n";\nexit 0;\n' > "$SDK_DIR/availability.pl"
          fi
          chmod +x "$SDK_DIR/availability.pl"
          echo "SUCCESS: availability.pl verified at $SDK_DIR/availability.pl"

      - name: Audit Repository Architecture Target
        run: |
          echo "=== HAKIOS ARCHITECTURE AUDIT ==="
          echo "Requested Device: Xiaomi 12 Lite (taoyao / Snapdragon 778G)"
          echo "Configured Default Target in Repo:"
          grep -rn "MACHINE" . || true
          grep -rn "DEVICE" Makefile || true
          
          if [ -d "devices/taoyao" ]; then
            echo "STATUS: Native taoyao device tree detected."
          else
            echo "WARNING: No devices/taoyao folder found! Fallback target detected."
          fi

      - name: Execute Build Target
        if: ${{ github.event.inputs.build_target != 'audit-only' }}
        run: |
          JOBS_CNT=${{ github.event.inputs.jobs }}
          
          if [ "${{ github.event.inputs.build_target }}" = "qemu-open" ]; then
            echo "Building QEMU target..."
            make qemu-open JOBS=$JOBS_CNT || make JOBS=$JOBS_CNT
          elif [ "${{ github.event.inputs.build_target }}" = "xnu-kernel" ]; then
            echo "Building XNU Kernel Target..."
            ./xnu-build.sh -j$JOBS_CNT -k
          fi

      - name: Package & Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hakios-build-logs-${{ github.event.inputs.build_target }}
          path: |
            *.log
            xnu-src/xnu-8796.121.2/BUILD/
            BUILD/
            build/
          if-no-files-found: warn
