name: Build HakiOS reference kernel (BCM2837 smoke test only)

# Based on the actual build system of github.com/Dx23456/ios-taoyao:
#   xnu/apply.sh        Apple's xnu-8796.121.2 (iOS 16.5) + hakios.patch -> xnu-src/
#   xnu-deps/setup.sh   host tools (mig, tcsh, unifdef...), the SDK, the two kext libs
#   ./xnu-build.sh      the kernel -> .../DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
#   xnuloader/          the UEFI boot loader (clang + lld-link, no EDK2) -> loader.efi
#
# The repo is pinned to iOS 16.5 (XNU 8796.121.2, iPhoneOS16.5.sdk), so there is
# no ios_version input. userland/ images need the full 7.4 GB IPSW and the phone
# firmware needs a physical device: both are out of scope for CI.

on:
  workflow_dispatch:
    inputs:
      identity:
        description: 'xnuloader identity.h source'
        required: true
        type: choice
        default: stock
        options:
          - stock       # from the iOS 16.5 IPSW device tree (34 KB, Apple's public CDN)
          - placeholder # Apple-free identity; builds/boots, but not for the iOS user space
  push:
    branches:
      - main
      - dev/*
      - 'work/**'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  THEOS: ${{ github.workspace }}/theos
  XNU_TAG: xnu-8796.121.2
  MACHINE: BCM2837
  KERNEL_BIN: xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Maximize Runner Disk Space
        run: |
          echo "==> Clearing unnecessary runner packages..."
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/doc/cmake \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm \
            flex bison m4 perl python3 \
            git curl tar xz-utils ca-certificates \
            autoconf automake libtool libxml2 \
            libtinfo6 uuid-dev

      # ------------------------------------------------------------------
      # Theos provides what the XNU build links with: the cctools (ld64,
      # libtool, otool, ...) and the iPhoneOS 16.5 SDK.
      # ------------------------------------------------------------------
      - name: Cache Theos Toolchain + SDK
        id: theos
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: theos-linux-x86_64-v1

      - name: Install Theos (Linux cctools + iPhoneOS 16.5 SDK)
        if: steps.theos.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          # Ensure a clean destination so git clone succeeds
          rm -rf "$THEOS"
          mkdir -p "$(dirname "$THEOS")"

          echo "==> Cloning theos..."
          git clone -q --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"

          mkdir -p "$THEOS/toolchain" "$THEOS/sdks"

          echo "==> Fetching the Linux iOS toolchain (cctools/ld64)..."
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz" \
            | tar -xJ -C "$THEOS/toolchain/"

          echo "==> Fetching iPhoneOS16.5.sdk (sparse, ~220 MB)..."
          git clone -q --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git "$THEOS/sdks-git"
          git -C "$THEOS/sdks-git" sparse-checkout set iPhoneOS16.5.sdk
          ln -sfn "$THEOS/sdks-git/iPhoneOS16.5.sdk" "$THEOS/sdks/iPhoneOS16.5.sdk"

          test -x "$THEOS/toolchain/linux/iphone/bin/ld"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include"

      # ------------------------------------------------------------------
      # Kernel: apply the patch to Apple's sources once, cache the tree.
      # ------------------------------------------------------------------
      - name: Restore Patched XNU Tree
        id: xnu-src
        uses: actions/cache@v4
        with:
          path: xnu-src
          # hashFiles() of multiple globs inserts commas → illegal in a cache key
          key: xnu-src-${{ env.XNU_TAG }}-${{ hashFiles('xnu/hakios.patch') }}-${{ hashFiles('xnu/files/**') }}

      - name: Apply HakiOS Patch to Apple's XNU
        if: steps.xnu-src.outputs.cache-hit != 'true'
        run: xnu/apply.sh

      # Critical: a previous failed run can leave a partial BUILD/ inside the
      # cache. Always start header export from a clean tree.
      - name: Clean previous XNU build products
        run: |
          rm -rf xnu-src/xnu-8796.121.2/BUILD
          rm -rf xnu-deps/exporthdrs.log xnu-deps/mig-build.log xnu-deps/tcsh-build.log

      - name: Build XNU Kernel
        id: build-xnu
        run: |
          set -euo pipefail
          . ./xnu-env.sh          # make sure THEOS / PATH / XNU_SRC are correct

          echo "==> Stage 1: host tools + SDK overlay"
          xnu-deps/setup.sh --stage1

          echo "==> Stage 2: export headers + build the two kext libraries"
          # Run stage2 explicitly so the die() message and log are clear
          xnu-deps/setup.sh --stage2

          echo "==> Building the kernel..."
          # -k is required by upstream (check_all_exports always fails after link)
          MACHINE="$MACHINE" ./xnu-build.sh -j"$(nproc)" -k
          echo "This artifact is a BCM2837 reference build; it is NOT a taoyao/SM7325 kernel."

          test -f "$KERNEL_BIN"
          ls -la "$KERNEL_BIN"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-build-logs-${{ github.sha }}
          path: |
            xnu-deps/exporthdrs.log
            xnu-deps/mig-build.log
            xnu-deps/tcsh-build.log
            xnu-src/xnu-8796.121.2/BUILD/
          retention-days: 7
          if-no-files-found: ignore

      # ------------------------------------------------------------------
      # Loader: a freestanding AArch64 UEFI application (no EDK2).
      # ------------------------------------------------------------------
      - name: Build xnuloader
        env:
          IDENTITY: ${{ inputs.identity || 'stock' }}
        run: |
          set -euo pipefail
          if [ "$IDENTITY" = "placeholder" ]; then
            PLACEHOLDER=1 xnuloader/mkidentity.sh
          else
            xnuloader/mkidentity.sh
          fi
          xnuloader/build.sh
          test -f xnuloader/loader.efi
          ls -la xnuloader/loader.efi

      - name: Build hello (Apple-free User Space Smoke Binary)
        run: |
          set -euo pipefail
          . ./xnu-env.sh
          xnu-clang -arch arm64 -Os -static -nostdlib -ffreestanding \
            -fno-stack-protector -fno-builtin \
            -Wl,-e,_start -Wl,-pagezero_size,0x100000000 \
            -o userland/hello userland/src/hello.c
          file userland/hello || true

      - name: Package Artifacts
        run: |
          mkdir -p out
          cp "$KERNEL_BIN" out/mach.development.bcm2837.reference-only
          cp xnuloader/loader.efi out/
          cp userland/hello out/
          {
            echo "HakiOS CI reference build (BCM2837 only; not taoyao)"
            echo "machine: $MACHINE"
            echo "native_taoyao: NO"
            echo "repo: ${{ github.repository }}"
            echo "commit: ${{ github.sha }}"
            echo "identity: ${{ inputs.identity || 'stock' }}"
            echo "built: $(date -u '+%Y-%m-%d %H:%M UTC')"
          } > out/BUILD-INFO.txt
          cd out
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hakios-reference-bcm2837-${{ env.XNU_TAG }}-${{ github.sha }}
          path: out/
          retention-days: 14
