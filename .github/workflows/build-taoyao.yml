name: Build HackiOS for Xiaomi 12 Lite (taoyao)

on:
  workflow_dispatch:
    inputs:
      ios_version:
        description: 'iOS Target Version'
        required: true
        default: '16.5'
      clean_cache:
        description: 'Clear Build Cache (true/false)'
        required: false
        default: 'false'
  push:
    branches:
      - main
      - dev/*
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  free-disk-space:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Runner Disk Space
        run: |
          echo "==> Clearing unnecessary toolchains and packages..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/doc/cmake
          sudo apt-get remove -y '^dotnet-.*' '^ghc-.*' '^php.*' '^openjdk-.*' google-chrome-stable
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h

  build-hackios:
    needs: free-disk-space
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout HackiOS Core Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment & Toolchains
        run: |
          sudo apt update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm ccache \
            python3 python3-pip python3-setuptools \
            bwrap socat ripgrep liblzfse-dev \
            libssl-dev libffi-dev libxml2-dev zlib1g-dev \
            fastboot android-sdk-platform-tools flex bison \
            device-tree-compiler cpio libelf-dev
          
          # 验证 LLVM 与 Python 环境
          clang --version
          python3 --version

      - name: Setup CCache
        uses: actions/cache@v4
        if: ${{ github.event.inputs.clean_cache != 'true' }}
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-taoyao-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-taoyao-

      - name: Checkout Device Tree & Firmware for Taoyao
        run: |
          mkdir -p devices/taoyao
          # 拉取适配 SM7325/taoyao 的设备定义与预提取固件仓库
          git clone --depth 1 https://github.com/skglab-dev/ios-taoyao.git devices/taoyao
          
          # 验证固件文件完整性
          if [ ! -d "devices/taoyao/firmware" ]; then
            echo "Error: Firmware missing from device tree repository!"
            exit 1
          fi

      - name: Fetch and Unpack iOS RootFS
        run: |
          IOS_VER="${{ github.event.inputs.ios_version || '16.5' }}"
          echo "==> Downloading and extracting Apple iOS $IOS_VER System Image..."
          
          chmod +x ./sysimage/fetch.sh
          ./sysimage/fetch.sh --version "$IOS_VER" --device "iPhone14,7" --output-dir ./sysimage/out

      - name: Patch & Build UEFI Bootloader (Project Silicium)
        run: |
          echo "==> Building UEFI Bootloader for Snapdragon 778G (SM7325)..."
          cd devices/taoyao/uefi
          make CROSS_COMPILE=aarch64-linux-gnu- PLATFORM=SM7325
          
          if [ ! -f "build/uefi-taoyao.elf" ]; then
            echo "UEFI build failed!"
            exit 1
          fi

      - name: Patch & Build HackiOS XNU Kernel
        run: |
          echo "==> Applying XNU Patches..."
          chmod +x ./xnu/apply.sh
          ./xnu/apply.sh
          
          echo "==> Compiling Mach-O Kernel for taoyao..."
          export CCACHE_DIR=~/.ccache
          export CC="ccache clang"
          export CXX="ccache clang++"
          
          make TARGET_DEVICE=taoyao ARCH=arm64 mach -j$(nproc)

      - name: Package Android Boot Image (boot.img)
        run: |
          echo "==> Assembling boot-hackios-taoyao.img..."
          mkdir -p out
          
          python3 tools/mkbootimg.py \
            --kernel devices/taoyao/uefi/build/uefi-taoyao.elf \
            --ramdisk sysimage/out/ramdisk.img \
            --dtb devices/taoyao/dtb.img \
            --cmdline "console=ttyMSM0,115200n8 loglevel=7 earlycon=msm_geni_serial,0x00880000 androidboot.hardware=qcom" \
            --base 0x00000000 \
            --pagesize 4096 \
            -o out/boot-hackios-taoyao.img

          # 计算产物 SHA256 校验和
          cd out && sha256sum boot-hackios-taoyao.img > checksums.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HackiOS-BootImage-Xiaomi12Lite-taoyao
          path: |
            out/boot-hackios-taoyao.img
            out/checksums.txt
            build/mach_kernel
          retention-days: 14
