name: Build HackiOS (XNU + UEFI) for Xiaomi 12 Lite (taoyao)

on:
  workflow_dispatch:
    inputs:
      ios_version:
        description: 'iOS Target Version'
        required: true
        default: '16.5'
  push:
    branches:
      - main
      - dev/*
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  build-taoyao:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Maximize Runner Disk Space
        run: |
          echo "==> Clearing unnecessary runner packages..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/doc/cmake
          sudo apt-get clean

      - name: Install Toolchains & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm ccache \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python3 python3-pip python3-setuptools \
            bubblewrap socat ripgrep liblzfse-dev \
            libssl-dev libffi-dev libxml2-dev zlib1g-dev \
            fastboot android-sdk-platform-tools flex bison \
            device-tree-compiler cpio libelf-dev uuid-dev

      - name: Setup Standalone Packaging Tools
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          mkdir -p tools
          echo "==> Fetching standalone LineageOS mkbootimg tool..."
          rm -rf tools/mkbootimg_repo
          git clone --depth 1 https://github.com/LineageOS/android_system_tools_mkbootimg.git tools/mkbootimg_repo

      - name: Compile XNU Kernel & Sync Binaries
        run: |
          echo "==> Step 1: Building/Preparing XNU Kernel (mach_kernel)..."
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ARCH=arm64
          
          # 若存在 xnu 子模組或獨立編譯指令，先進行核心編譯
          if [ -d "xnu" ]; then
            cd xnu
            make ARCH=arm64 TARGET=SM7325 || make ARCH=arm64 || true
            cd ..
          elif [ -f "scripts/build_xnu.sh" ]; then
            chmod +x scripts/build_xnu.sh && ./scripts/build_xnu.sh || true
          fi

          # 搜尋編譯產出的 mach_kernel 並同步複製至 EDK2 預期載入的目錄下
          XNU_BIN=$(find . -not -path '*/.*' \( -name "mach_kernel" -o -name "mach" \) | head -n 1)
          if [ -n "$XNU_BIN" ]; then
            echo "==> Found XNU Kernel at: $XNU_BIN"
            mkdir -p prebuilt uefi/prebuilt
            cp "$XNU_BIN" prebuilt/mach_kernel 2>/dev/null || true
            cp "$XNU_BIN" uefi/prebuilt/mach_kernel 2>/dev/null || true
            echo "==> Copied $XNU_BIN to prebuilt/ places for EDK2 FDF inclusion."
          else
            echo "::warning:: No standalone mach_kernel found before UEFI build. Ensure EDK2 builds it internally!"
          fi

      - name: Build EDK2 UEFI Payload
        run: |
          echo "==> Step 2: Building UEFI Bootloader Payload for Xiaomi 12 Lite (taoyao)..."
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          if [ -f "build.sh" ]; then
            chmod +x build.sh && ./build.sh --device taoyao --platform SM7325
          elif [ -f "Makefile" ]; then
            make PLATFORM=SM7325 DEVICE=taoyao || make PLATFORM=SM7325 || make
          elif [ -d "uefi" ]; then
            cd uefi
            if [ -f "build.sh" ]; then
              chmod +x build.sh && ./build.sh --device taoyao
            elif [ -f "Makefile" ]; then
              make PLATFORM=SM7325 || make
            fi
            cd ..
          else
            echo "Error: No valid build entrypoint found!"
            exit 1
          fi

      - name: Payload & XNU Inclusion Inspection
        run: |
          echo "==> Step 3: Inspecting built target binary..."
          
          BOOT_BIN=$(find . -not -path '*/.*' -type f \( -name "*.elf" -o -name "*.fd" -o -name "*.bin" -o -name "Image" -o -name "mach_kernel" \) | grep -i "taoyao" | head -n 1)
          if [ -z "$BOOT_BIN" ]; then
            BOOT_BIN=$(find . -not -path '*/.*' -not -path '*/poco*' -not -path '*/tools*' -type f \( -name "*.elf" -o -name "*.fd" -o -name "*.bin" -o -name "Image" -o -name "mach_kernel" \) | head -n 1)
          fi
          
          if [ -z "$BOOT_BIN" ]; then
            echo "Error: No UEFI/Kernel binary was generated by the build step!"
            exit 1
          fi
          
          BIN_SIZE=$(stat -c%s "$BOOT_BIN")
          echo "==> Detected payload binary: $BOOT_BIN"
          echo "==> Payload size: $BIN_SIZE bytes (~$((BIN_SIZE / 1024 / 1024)) MB)"
          
          # 核心大限檢測：低於 8MB 說明極大概率未嵌進 XNU 内核
          if [ "$BIN_SIZE" -lt 8388608 ]; then
            echo "----------------------------------------------------------------------"
            echo "::warning:: Target binary is smaller than 8MB ($BIN_SIZE bytes)."
            echo "This indicates XNU (mach_kernel) was likely NOT embedded into UEFI."
            echo "Check your EDK2 .fdf file or prebuilt mach_kernel placement."
            echo "----------------------------------------------------------------------"
          fi

      - name: Package Final Boot Image (boot-hackios-taoyao.img)
        run: |
          mkdir -p out
          
          BOOT_BIN=$(find . -not -path '*/.*' -type f \( -name "*.elf" -o -name "*.fd" -o -name "*.bin" -o -name "Image" -o -name "mach_kernel" \) | grep -i "taoyao" | head -n 1)
          if [ -z "$BOOT_BIN" ]; then
            BOOT_BIN=$(find . -not -path '*/.*' -not -path '*/poco*' -not -path '*/tools*' -type f \( -name "*.elf" -o -name "*.fd" -o -name "*.bin" -o -name "Image" -o -name "mach_kernel" \) | head -n 1)
          fi
          
          DTB_ARG=""
          DTB_FILE=$(find . -not -path '*/.*' \( -name "*taoyao*.dtb" -o -name "*sm7325*.dtb" \) | head -n 1)
          if [ -n "$DTB_FILE" ]; then
            DTB_ARG="--dtb $DTB_FILE"
            echo "==> Including Device Tree DTB: $DTB_FILE"
          fi
          
          echo "==> Packaging boot image via LineageOS mkbootimg..."
          python3 tools/mkbootimg_repo/mkbootimg.py \
            --kernel "$BOOT_BIN" \
            $DTB_ARG \
            --cmdline " -v console=ttyMSM0,115200n8 loglevel=7 earlycon=msm_geni_serial,0x00880000 androidboot.hardware=qcom" \
            --base 0x00000000 \
            --pagesize 4096 \
            -o out/boot-hackios-taoyao.img

          if [ ! -f "out/boot-hackios-taoyao.img" ]; then
            echo "Error: Packaging failed, out/boot-hackios-taoyao.img not found!"
            exit 1
          fi
          
          IMG_SIZE=$(stat -c%s "out/boot-hackios-taoyao.img")
          echo "==> Packaging SUCCESS! Finalboot image size: ${IMG_SIZE} bytes (~$((IMG_SIZE / 1024 / 1024)) MB)."
          
          cd out && sha256sum boot-hackios-taoyao.img > checksums.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HackiOS-BootImage-Xiaomi12Lite-taoyao
          path: out/
          retention-days: 14
