name: Build HackiOS for Xiaomi 12 Lite (taoyao)

on:
  workflow_dispatch:
    inputs:
      ios_version:
        description: 'iOS Target Version'
        required: true
        default: '16.5'
  push:
    branches:
      - main
      - dev/*
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  build-taoyao:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Maximize Runner Disk Space
        run: |
          echo "==> Clearing unnecessary pre-installed toolchains..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/doc/cmake
          sudo apt-get clean

      - name: Setup Build Environment & Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm ccache \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python3 python3-pip python3-setuptools \
            bubblewrap socat ripgrep liblzfse-dev \
            libssl-dev libffi-dev libxml2-dev zlib1g-dev \
            fastboot android-sdk-platform-tools flex bison \
            device-tree-compiler cpio libelf-dev mkbootimg

      - name: Setup Packaging Tools
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          mkdir -p tools
          if ! command -v mkbootimg &> /dev/null; then
            echo "==> Pulling mkbootimg from LineageOS repository..."
            rm -rf tools/mkbootimg_repo
            git clone --depth 1 https://github.com/LineageOS/android_system_tools_mkbootimg.git tools/mkbootimg_repo || true
            if [ -f "tools/mkbootimg_repo/mkbootimg.py" ]; then
              cp tools/mkbootimg_repo/mkbootimg.py tools/mkbootimg.py
            fi
          fi

      - name: Build UEFI Bootloader / Kernel
        run: |
          echo "==> Starting build process..."
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          if [ -d "uefi" ]; then
            cd uefi && make PLATFORM=SM7325
          elif [ -f "Makefile" ]; then
            make PLATFORM=SM7325 || make
          elif [ -f "build.sh" ]; then
            chmod +x build.sh && ./build.sh
          else
            echo "Error: No recognized build script (Makefile or build.sh) found in repository!"
            exit 1
          fi

      - name: Diagnostics - List All Generated Files
        run: |
          echo "==> Listing files after build step:"
          find . -not -path '*/.*' -type f | sort

      - name: Package Boot Image (boot.img)
        run: |
          mkdir -p out
          
          # 全局搜索常见的内核/UEFI 编译产物
          BOOT_BIN=$(find . -not -path '*/.*' -type f \( -name "*.elf" -o -name "*.fd" -o -name "*.bin" -o -name "Image" -o -name "mach_kernel" \) | head -n 1)
          
          if [ -z "$BOOT_BIN" ]; then
            echo "Error: Could not automatically detect built binary."
            echo "Please check the 'Diagnostics - List All Generated Files' step above."
            exit 1
          fi
          
          echo "==> Detected target boot binary: $BOOT_BIN"
          
          # 确定 mkbootimg 命令
          if command -v mkbootimg &> /dev/null; then
            MKBOOT="mkbootimg"
          elif [ -f "tools/mkbootimg.py" ]; then
            MKBOOT="python3 tools/mkbootimg.py"
          else
            echo "Error: mkbootimg tool not found!"
            exit 1
          fi
          
          $MKBOOT \
            --kernel "$BOOT_BIN" \
            --cmdline "console=ttyMSM0,115200n8 loglevel=7 earlycon=msm_geni_serial,0x00880000 androidboot.hardware=qcom" \
            --base 0x00000000 \
            --pagesize 4096 \
            -o out/boot-hackios-taoyao.img

          if [ ! -f "out/boot-hackios-taoyao.img" ]; then
            echo "Error: Packaging failed, out/boot-hackios-taoyao.img was not produced!"
            exit 1
          fi
          
          cd out && sha256sum boot-hackios-taoyao.img > checksums.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HackiOS-BootImage-Xiaomi12Lite-taoyao
          path: out/
          retention-days: 14
