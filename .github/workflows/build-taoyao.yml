name: Build HackiOS for Xiaomi 12 Lite (taoyao)

on:
  workflow_dispatch:
    inputs:
      ios_version:
        description: 'iOS Target Version'
        required: true
        default: '16.5'
  push:
    branches:
      - main
      - dev/*
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  build-taoyao:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Maximize Runner Disk Space
        run: |
          echo "==> Clearing unnecessary pre-installed toolchains..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/doc/cmake
          sudo apt-get clean

      - name: Setup Build Environment & Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm ccache \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python3 python3-pip python3-setuptools \
            bubblewrap socat ripgrep liblzfse-dev \
            libssl-dev libffi-dev libxml2-dev zlib1g-dev \
            fastboot android-sdk-platform-tools flex bison \
            device-tree-compiler cpio libelf-dev

      - name: Setup Standalone Packaging Tools
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          mkdir -p tools
          echo "==> Fetching full mkbootimg repository from LineageOS..."
          rm -rf tools/mkbootimg_repo
          git clone --depth 1 https://github.com/LineageOS/android_system_tools_mkbootimg.git tools/mkbootimg_repo
          
          if [ ! -f "tools/mkbootimg_repo/mkbootimg.py" ]; then
            echo "Error: Failed to fetch standalone mkbootimg.py"
            exit 1
          fi

      - name: Build UEFI Bootloader / Kernel
        run: |
          echo "==> Starting build process..."
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          if [ -d "uefi" ]; then
            cd uefi && make PLATFORM=SM7325
          elif [ -f "Makefile" ]; then
            make PLATFORM=SM7325 || make
          elif [ -f "build.sh" ]; then
            chmod +x build.sh && ./build.sh
          else
            echo "Error: No recognized build script found!"
            exit 1
          fi

      - name: Package Boot Image (boot.img)
        run: |
          mkdir -p out
          
          # 1. 优先搜索包含 taoyao 的二进制文件
          BOOT_BIN=$(find . -not -path '*/.*' -type f \( -name "*.elf" -o -name "*.fd" -o -name "*.bin" -o -name "Image" -o -name "mach_kernel" \) | grep -i "taoyao" | head -n 1)
          
          # 2. 若未搜索到，排除 poco 等其他无关设备后再次搜索
          if [ -z "$BOOT_BIN" ]; then
            BOOT_BIN=$(find . -not -path '*/.*' -not -path '*/poco*' -not -path '*/tools/*' -type f \( -name "*.elf" -o -name "*.fd" -o -name "*.bin" -o -name "Image" -o -name "mach_kernel" \) | head -n 1)
          fi
          
          if [ -z "$BOOT_BIN" ]; then
            echo "Error: Could not locate a valid binary for taoyao!"
            exit 1
          fi
          
          echo "==> Selected boot binary: $BOOT_BIN"
          
          # 直接使用独立的 LineageOS Python 脚本进行打包（自带完整 gki 依赖）
          python3 tools/mkbootimg_repo/mkbootimg.py \
            --kernel "$BOOT_BIN" \
            --cmdline "console=ttyMSM0,115200n8 loglevel=7 earlycon=msm_geni_serial,0x00880000 androidboot.hardware=qcom" \
            --base 0x00000000 \
            --pagesize 4096 \
            -o out/boot-hackios-taoyao.img

          if [ ! -f "out/boot-hackios-taoyao.img" ]; then
            echo "Error: Packaging failed, out/boot-hackios-taoyao.img was not generated!"
            exit 1
          fi
          
          cd out && sha256sum boot-hackios-taoyao.img > checksums.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HackiOS-BootImage-Xiaomi12Lite-taoyao
          path: out/
          retention-days: 14
