name: Build HackiOS for Xiaomi 12 Lite (taoyao)

on:
  workflow_dispatch:
    inputs:
      ios_version:
        description: 'iOS Target Version'
        required: true
        default: '16.5'
  push:
    branches:
      - main
      - dev/*
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  build-taoyao:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Maximize Runner Disk Space
        run: |
          echo "==> Clearing unnecessary pre-installed toolchains..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/doc/cmake
          sudo apt-get clean

      - name: Setup Build Environment & Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm ccache \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python3 python3-pip python3-setuptools \
            bubblewrap socat ripgrep liblzfse-dev \
            libssl-dev libffi-dev libxml2-dev zlib1g-dev \
            fastboot android-sdk-platform-tools flex bison \
            device-tree-compiler cpio libelf-dev

      - name: Setup Packaging Tools
        run: |
          mkdir -p tools
          if [ ! -f "tools/mkbootimg.py" ]; then
            echo "==> Fetching AOSP mkbootimg tool via git clone..."
            rm -rf tools/mkbootimg_repo
            git clone --depth 1 https://github.com/aosp-mirror/platform_system_tools_mkbootimg.git tools/mkbootimg_repo
            cp tools/mkbootimg_repo/mkbootimg.py tools/mkbootimg.py
          fi
          
          if [ ! -f "tools/mkbootimg.py" ]; then
            echo "Error: Failed to obtain mkbootimg.py"
            exit 1
          fi

      - name: Inspect Workspace Structure
        run: |
          echo "==> Repository structure at root:"
          ls -la

      - name: Build UEFI Bootloader / Kernel
        run: |
          echo "==> Building Bootloader/Kernel..."
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          if [ -d "uefi" ]; then
            cd uefi && make PLATFORM=SM7325
          elif [ -f "Makefile" ]; then
            make PLATFORM=SM7325 || make
          else
            echo "Error: No Makefile found in repository!"
            exit 1
          fi

      - name: Package Boot Image (boot.img)
        run: |
          mkdir -p out
          
          BOOT_BIN=$(find . -maxdepth 3 \( -name "*.elf" -o -name "Image" -o -name "mach_kernel" \) | head -n 1)
          
          if [ -z "$BOOT_BIN" ]; then
            echo "Error: No compiled kernel binary (.elf / Image / mach_kernel) was found after build!"
            exit 1
          fi
          
          echo "==> Found boot binary: $BOOT_BIN"
          
          python3 tools/mkbootimg.py \
            --kernel "$BOOT_BIN" \
            --cmdline "console=ttyMSM0,115200n8 loglevel=7 earlycon=msm_geni_serial,0x00880000 androidboot.hardware=qcom" \
            --base 0x00000000 \
            --pagesize 4096 \
            -o out/boot-hackios-taoyao.img

          if [ ! -f "out/boot-hackios-taoyao.img" ]; then
            echo "Error: boot-hackios-taoyao.img generation failed!"
            exit 1
          fi
          
          cd out && sha256sum boot-hackios-taoyao.img > checksums.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HackiOS-BootImage-Xiaomi12Lite-taoyao
          path: out/
          retention-days: 14
