name: Build XNU Kernel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Compiler Wrappers
        run: |
          mkdir -p $HOME/bin
          ln -sf $(xcrun -f clang) $HOME/bin/xnu-clang
          ln -sf $(xcrun -f clang++) $HOME/bin/xnu-clang++
          ln -sf $(xcrun -f ar) $HOME/bin/xnu-ar
          ln -sf $(xcrun -f libtool) $HOME/bin/xnu-libtool
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Ensure XNU Source Directory Exists
        run: |
          mkdir -p xnu-src
          
          if [ ! -d "xnu-src/xnu-8796.121.2" ]; then
            echo "Downloading XNU 8796.121.2 source archive..."
            curl -LO https://github.com/apple-oss-distributions/xnu/archive/refs/tags/xnu-8796.121.2.tar.gz
            
            echo "Extracting source archive..."
            tar -xzf xnu-8796.121.2.tar.gz -C xnu-src/
            rm xnu-8796.121.2.tar.gz
            
            if [ -d "xnu-src/xnu-xnu-8796.121.2" ]; then
              mv xnu-src/xnu-xnu-8796.121.2 xnu-src/xnu-8796.121.2
            fi
          fi

      - name: Install AvailabilityVersions Dependency
        run: |
          git clone https://github.com/apple-oss-distributions/AvailabilityVersions.git
          cd AvailabilityVersions
          mkdir -p dst
          make install SRCROOT=$PWD DSTROOT=$PWD/dst

          # Install availability.pl into iPhoneOS SDK
          IPHONE_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          sudo mkdir -p "$IPHONE_SDK/usr/local/libexec"
          sudo ditto dst/usr/local/libexec "$IPHONE_SDK/usr/local/libexec"
          sudo chmod +x "$IPHONE_SDK/usr/local/libexec/availability.pl"

          # Install availability.pl into MacOSX SDK
          MAC_SDK=$(xcrun --sdk macosx --show-sdk-path)
          sudo mkdir -p "$MAC_SDK/usr/local/libexec"
          sudo ditto dst/usr/local/libexec "$MAC_SDK/usr/local/libexec"
          sudo chmod +x "$MAC_SDK/usr/local/libexec/availability.pl"

          cd ..
          rm -rf AvailabilityVersions

      - name: Patch XNU Source Code
        run: |
          XNU_DIR="xnu-src/xnu-8796.121.2"

          # 1. Fix duplicate struct member 'reserved10' in osfmk/arm/pmap/pmap.h
          PMAP_HEADER="$XNU_DIR/osfmk/arm/pmap/pmap.h"
          if [ -f "$PMAP_HEADER" ]; then
            sed -i '' '445s/bool reserved10;/bool reserved10_2;/' "$PMAP_HEADER"
          fi

      - name: Execute XNU Build
        env:
          EXTRA_CFLAGS: "-Wno-align-mismatch -Wno-deprecated-declarations -Wno-error"
          EXTRA_CXXFLAGS: "-Wno-align-mismatch -Wno-deprecated-declarations -Wno-error"
        run: |
          chmod +x xnu-build.sh
          JOBS_CNT=4 ./xnu-build.sh
