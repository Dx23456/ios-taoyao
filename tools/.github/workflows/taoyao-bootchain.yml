
name: HakiOS taoyao Boot Chain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld llvm \
            python3 python3-pip \
            file gzip

      - name: Check taoyao platform assets
        run: |
          set -euo pipefail

          for f in \
            devices/taoyao/prebuilt/BootShim.bin \
            devices/taoyao/prebuilt/SILICIUM_UEFI.fd \
            devices/taoyao/prebuilt/device-tree.dtb \
            devices/taoyao/prebuilt/ramdisk \
            devices/taoyao/prebuilt/mkbootimg.py; do
            test -s "$f" || {
              echo "::error::Missing or empty asset: $f"
              exit 1
            }
          done

          test "$(stat -c%s devices/taoyao/prebuilt/SILICIUM_UEFI.fd)" -eq 2097152

      - name: Check for native taoyao XNU kernel
        run: |
          if [ ! -s devices/taoyao/prebuilt/mach.taoyao ]; then
            echo "::error::No SM7325-compatible XNU kernel found."
            echo "Build or provide devices/taoyao/prebuilt/mach.taoyao first."
            exit 1
          fi

      - name: Build and package boot chain
        env:
          XNU_KERNEL: devices/taoyao/prebuilt/mach.taoyao
          OUT: out/taoyao
        run: |
          chmod +x tools/build-taoyao-image.sh
          chmod +x xnuloader/build.sh
          chmod +x xnuloader/mkidentity.sh
          tools/build-taoyao-image.sh

      - name: Upload taoyao artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hakios-taoyao-experimental
          path: out/taoyao/
          if-no-files-found: error
          retention-days: 14
